<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGR - Iniciar Sesión / Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">   
    <body class="auth-page"></body>

    
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">

            <div class="card auth-card mt-4 mb-4">
                <div class="auth-header">
                    <img src="img/LogoEcogr.png" alt="EcoGR" width="140" class="mb-3">
                    <h4 class="mb-0">Bienvenido a EcoGR</h4>
                    <p class="mb-0 opacity-75">Consumo y producción sostenibles</p>
                </div>

                <div class="card-body p-3">

                    <!-- Pestañas -->
                    <ul class="nav nav-tabs mb-4 justify-content-center" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrarse</button>
                        </li>
                    </ul>

                    <!-- LOGIN -->
<div class="tab-pane fade show active" id="login" role="tabpanel">
    <form id="loginForm">
        <div class="mb-3">
            <label for="loginEmail" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="mb-4">
            <label for="loginPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <!-- Botón con onclick -->
        <button type="button" class="btn btn-success w-100" 
                onclick="ejecutarLoginSimple()">
            Iniciar Sesión
        </button>
    </form>
</div>

<!-- REGISTRO -->
<div class="tab-pane fade" id="register" role="tabpanel">
    <form id="registerForm">
        <div class="mb-3">
            <label for="registerName" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="registerName" required>
        </div>
        <div class="mb-3">
            <label for="registerEmail" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="registerEmail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="mb-4">
            <label for="registerPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="registerPassword" minlength="6" required>
        </div>
        <!-- Botón con onclick -->
        <button type="button" class="btn btn-success w-100" 
                onclick="ejecutarRegistroSimple()">
            Crear cuenta
        </button>
    </form>
</div>

                    <div class="text-center mt-4">
                        <small class="text-muted">
                            Al continuar aceptas nuestros <a href="#" class="text-success">términos y condiciones</a>
                        </small>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-success text-decoration-none">
                    ← Volver al inicio
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

// Variables 
let correos = [];
let claves = [];
let nombres = [];
let usuarioActual = null;
let sesionActiva = false;

// Funciones 
function existeCorreo(correo) {
    for (let i = 0; i < correos.length; i++) {
        if (correos[i] === correo) return true;
    }
    return false;
}

function buscarPosicionCorreo(correo) {
    for (let i = 0; i < correos.length; i++) {
        if (correos[i] === correo) return i;
    }
    return -1;
}

// Registro 
function registrar(nombre, correo, clave) {
    if (!nombre.trim() || !correo.trim() || !clave) {
        alert("Todos los campos son obligatorios");
        return false;
    }
    
    if (clave.length < 6) {
        alert("La contraseña debe tener mínimo 6 caracteres");
        return false;
    }
    
    if (existeCorreo(correo)) {
        alert("El correo ya está registrado");
        return false;
    }
    
    nombres.push(nombre);
    correos.push(correo.toLowerCase());
    claves.push(clave);
    
    alert("Registro exitoso");
    return true;
}

// Login 
function iniciarSesion(correo, clave) {
    let indice = buscarPosicionCorreo(correo.toLowerCase());
    
    if (indice === -1) {
        alert("Correo no encontrado");
        return false;
    }
    
    if (claves[indice] !== clave) {
        alert("Contraseña incorrecta");
        return false;
    }
    
    usuarioActual = nombres[indice];
    sesionActiva = true;
    
    alert("Ingresaste correctamente");
    return true;
}

// Funciones simples 
function ejecutarRegistroSimple() {
    let nombre = document.getElementById("registerName").value;
    let correo = document.getElementById("registerEmail").value;
    let clave  = document.getElementById("registerPassword").value;
    
    registrar(nombre, correo, clave);
}

function ejecutarLoginSimple() {
    let correo = document.getElementById("loginEmail").value;
    let clave  = document.getElementById("loginPassword").value;
    
    iniciarSesion(correo, clave);
}
</script>
</body>
</html>
