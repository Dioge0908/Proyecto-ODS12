// Variables 
let correos = [];
let claves = [];
let nombres = [];
let usuarioActual = null;
let sesionActiva = false;

// Funciones 
function existeCorreo(correo) {
    for (let i = 0; i < correos.length; i++) {
        if (correos[i] === correo) return true;
    }
    return false;
}

function buscarPosicionCorreo(correo) {
    for (let i = 0; i < correos.length; i++) {
        if (correos[i] === correo) return i;
    }
    return -1;
}

// Registro 
function registrar(nombre, correo, clave) {
    if (!nombre.trim() || !correo.trim() || !clave) {
        alert("Todos los campos son obligatorios");
        return false;
    }
    
    if (clave.length < 6) {
        alert("La contraseña debe tener mínimo 6 caracteres");
        return false;
    }
    
    if (existeCorreo(correo)) {
        alert("El correo ya está registrado");
        return false;
    }
    
    nombres.push(nombre);
    correos.push(correo.toLowerCase());
    claves.push(clave);
    
    alert("Registro exitoso");
    return true;
}

// Login 
function iniciarSesion(correo, clave) {
    let indice = buscarPosicionCorreo(correo.toLowerCase());
    
    if (indice === -1) {
        alert("Correo no encontrado");
        return false;
    }
    
    if (claves[indice] !== clave) {
        alert("Contraseña incorrecta");
        return false;
    }
    
    usuarioActual = nombres[indice];
    sesionActiva = true;
    
    alert("Ingresaste correctamente");
    return true;
}
